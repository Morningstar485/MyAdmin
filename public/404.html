<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>MyAdmin Redirect</title>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        var l = window.location;
        if (l.hostname.includes('github.io')) {
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, 1 + l.pathname.split('/').slice(1).indexOf('MyAdmin')).join('/') + '/?p=' +
                l.pathname.replace(/&/g, '~and~').replace(l.pathname.split('/').slice(0, 1 + l.pathname.split('/').slice(1).indexOf('MyAdmin')).join('/'), '') +
                (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
            );
        }
    </script>
</head>

<body>
</body>

</html>
